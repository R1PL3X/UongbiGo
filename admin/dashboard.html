<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - Uông Bí GO</title>
<link rel="icon" href="../favicon.ico" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <div class="admin-sidebar">
    <div class="brand">🍱 Uông Bí GO</div>
    <nav>
      <a href="dashboard.html" class="active">📊 Tổng quan</a>
      <a href="menu-management.html">🍜 Quản lý Menu</a>
      <a href="orders.html">🧾 Quản lý Đơn hàng</a>
    </nav>
    <div class="logout-box">
      <div style="font-size:13px; margin-bottom:10px;" id="userName"></div>
      <button class="btn btn-outline btn-sm btn-block" id="btnLogout">Đăng xuất</button>
    </div>
  </div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div class="page-title" style="margin:0;">Tổng quan hoạt động</div>
    </div>
    <div id="alertBox"></div>

    <div class="stat-cards">
      <div class="stat-card accent">
        <div class="label">Tổng doanh thu</div>
        <div class="value" id="statDoanhThu">--</div>
      </div>
      <div class="stat-card">
        <div class="label">Đơn hoàn thành</div>
        <div class="value" id="statDonHoanThanh">--</div>
      </div>
      <div class="stat-card">
        <div class="label">Tổng số đơn</div>
        <div class="value" id="statTongDon">--</div>
      </div>
      <div class="stat-card">
        <div class="label">Món đang bán</div>
        <div class="value" id="statMonDangBan">--</div>
      </div>
      <div class="stat-card">
        <div class="label">Món hết hàng</div>
        <div class="value" id="statMonHetHang">--</div>
      </div>
    </div>

    <div class="section-card">
      <h2>Phân bố trạng thái đơn hàng</h2>
      <div id="chartBox"></div>
    </div>

    <div class="section-card">
      <h2>Đơn hàng gần đây</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead>
          <tbody id="recentOrdersBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  const user = Auth.requireRole(["ROLE_ADMIN"]);
  if (user) {
    document.getElementById("userName").textContent = user.hoTen;
    document.getElementById("btnLogout").addEventListener("click", () => { Auth.clear(); goTo("../index.html"); });
    loadDashboard();
  }

  const STATUS_COLORS = {
    CHO_THANH_TOAN: "#ca8a04", DA_THANH_TOAN: "#1d4ed8", DANG_CHUAN_BI: "#6d28d9",
    SAN_SANG_NHAN: "#0e7490", HOAN_THANH: "#16a34a", DA_HUY: "#dc2626",
  };

  async function loadDashboard() {
    const alertBox = document.getElementById("alertBox");
    try {
      const [thongKe, donHangs] = await Promise.all([
        apiFetch("/admin/thong-ke"),
        apiFetch("/admin/don-hang"),
      ]);

      document.getElementById("statDoanhThu").textContent = formatCurrency(thongKe.tongDoanhThu);
      document.getElementById("statDonHoanThanh").textContent = thongKe.tongSoDonHoanThanh;
      document.getElementById("statTongDon").textContent = thongKe.tongSoDonTatCa;
      document.getElementById("statMonDangBan").textContent = thongKe.soMonDangBan;
      document.getElementById("statMonHetHang").textContent = thongKe.soMonHetHang;

      renderChart(donHangs);

      const tbody = document.getElementById("recentOrdersBody");
      tbody.innerHTML = donHangs.slice(0, 8).map((d) => `
        <tr>
          <td>${d.maDonRutGon || "#" + d.maDonHang}</td>
          <td>${formatDateTime(d.ngayDat)}</td>
          <td>${formatCurrency(d.tongTien)}</td>
          <td>${statusPillHtml(d.trangThai)}</td>
        </tr>
      `).join("") || `<tr><td colspan="4" class="text-muted">Chưa có đơn hàng nào</td></tr>`;
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  function renderChart(donHangs) {
    const counts = {};
    donHangs.forEach((d) => { counts[d.trangThai] = (counts[d.trangThai] || 0) + 1; });
    const entries = Object.entries(counts);
    const max = Math.max(1, ...entries.map(([, c]) => c));
    const barWidth = 60, gap = 24, height = 160;
    const chartBox = document.getElementById("chartBox");
    if (entries.length === 0) { chartBox.innerHTML = '<p class="text-muted">Chưa có dữ liệu.</p>'; return; }

    const svgWidth = entries.length * (barWidth + gap);
    let bars = "";
    entries.forEach(([status, count], i) => {
      const barHeight = (count / max) * (height - 30);
      const x = i * (barWidth + gap);
      const y = height - barHeight;
      bars += `
        <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="6" fill="${STATUS_COLORS[status] || "#94a3b8"}"></rect>
        <text x="${x + barWidth / 2}" y="${y - 8}" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">${count}</text>
        <text x="${x + barWidth / 2}" y="${height + 18}" text-anchor="middle" font-size="10.5" fill="#64748b">${STATUS_LABEL[status] || status}</text>
      `;
    });
    chartBox.innerHTML = `<svg width="${svgWidth}" height="${height + 30}" style="max-width:100%;">${bars}</svg>`;
  }
</script>
</body>
</html>
